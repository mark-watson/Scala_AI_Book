<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scala AI Book: Laminar Web App</title>
<style>
body { font-family: system-ui, sans-serif; margin: 2rem; background: #f7f7f5; color: #222; }
.page { max-width: 640px; margin: 0 auto; }
.card { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 1rem 1.25rem; margin: 1rem 0; }
.row { display: flex; align-items: center; gap: 0.75rem; margin: 0.5rem 0; }
.slider-label { flex: 0 0 220px; }
.slider-value { flex: 0 0 64px; text-align: right; font-variant-numeric: tabular-nums; }
input[type="range"] { flex: 1; }
input[type="text"] { width: 100%; padding: 0.4rem; font-size: 1rem; }
.result { font-size: 1.4rem; font-weight: bold; }
.bar-track { height: 14px; background: #eee; border-radius: 7px; overflow: hidden; margin-top: 0.5rem; }
.bar-fill { height: 100%; background: #2a7ae2; width: 0%; }
</style>
</head>
<body>
<div id="app"></div>
<script src="main.js"></script>
</body>
</html>
